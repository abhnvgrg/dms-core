name: Backend tests

on:
  push:
    branches: [main, development, backend]
  pull_request:
    branches: [main, development]

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: nyayvault
          POSTGRES_USER: nyayvault
          POSTGRES_PASSWORD: nyayvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyayvault -d nyayvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NYAYVAULT_TEST_DATABASE_URL: postgresql+asyncpg://nyayvault:nyayvault@localhost:5432/nyayvault_test
      ROOT_ENCRYPTION_KEY: 6Yt3xUlSKZ1nS3HmB6pJvY5PbLQq3H4bYyR9dQnJqXo=
      MINIO_ACCESS_KEY: ci-access-key
      MINIO_SECRET_KEY: ci-secret-key
      BLOCKCHAIN_ANCHORING_ENABLED: "false"
      MALWARE_SCANNING_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
